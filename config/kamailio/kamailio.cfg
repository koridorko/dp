# Kamailio for SIP–Matrix bridge (minimal config).
# INVITE is POSTed to HTTP bridge; bridge returns SDP for 200 OK.
# BRIDGE_HTTP_URL is replaced at startup (run_kamailio.sh).

#!KAMAILIO

# ---------- Global parameters ----------
# Log to stderr so podman logs kamailio shows something (xlog + core)
log_stderror=yes
debug=3

# Port 5061 – same as original Python SIP socket server (Linphone worked on it)
listen=udp:0.0.0.0:5061
listen=tcp:0.0.0.0:5061

# ---------- Modules ----------
# tm before sl (sl needs tm)
loadmodule "tm.so"
loadmodule "sl.so"
loadmodule "pv.so"
loadmodule "textops.so"
loadmodule "xlog.so"
loadmodule "http_client.so"
loadmodule "htable.so"

# HTTP bridge: URL to Python HTTP server (POST /invite)
# In Docker set e.g. http://host.docker.internal:8080/
modparam("http_client", "httpcon", "bridge=>BRIDGE_HTTP_URL")
modparam("http_client", "connection_timeout", 95)
modparam("http_client", "query_result", 0)
modparam("http_client", "query_maxdatasize", 0)

# htable: Call-ID -> Linphone address (so we can send BYE from bridge to Linphone)
modparam("htable", "htable", "client=>size=8;autoexpire=3600")

# ---------- Routing ----------
request_route {
    if (is_method("REGISTER")) {
        xlog("L_INFO", "[SIP] REGISTER -> 200 OK\n");
        sl_reply("200", "OK");
        exit;
    }
    if (is_method("INVITE")) {
        xlog("L_INFO", "[SIP] INVITE -> bridge\n");
        route(TO_MATRIX_BRIDGE);
        exit;
    }
    # ACK after 200 OK to INVITE: we don't reply, but t_check_trans() matches ACK to transaction and stops 200 OK retransmits
    if (is_method("ACK")) {
        if (t_check_trans()) {
            xlog("L_INFO", "[SIP] ACK matched INVITE transaction; stopping 200 OK retransmits\n");
        } else {
            xlog("L_INFO", "[SIP] ACK received (no matching transaction)\n");
        }
        exit;
    }
    if (is_method("BYE")) {
        if ($si == "127.0.0.1" || $si == "::1") {
            route(FORWARD_BYE_TO_CLIENT);
            exit;
        }
        xlog("L_INFO", "[SIP] BYE from Linphone -> bridge\n");
        route(BYE_TO_BRIDGE);
        exit;
    }
    if (is_method("CANCEL")) {
        xlog("L_INFO", "[SIP] CANCEL -> 200 OK\n");
        sl_reply("200", "OK");
        exit;
    }
    xlog("L_INFO", "[SIP] $rm -> 404\n");
    sl_reply("404", "Not Found");
}

# Stateful INVITE: t_newtran + t_reply so ACK from Linphone correctly completes dialog (Linphone goes to connected and starts RTP)
route[TO_MATRIX_BRIDGE] {
    if (!t_newtran()) {
        xlog("L_ERR", "[SIP] t_newtran failed\n");
        sl_reply("500", "Internal Error");
        exit;
    }
    t_reply("100", "Trying");
    $sht(client=>$ci) = $si + ":" + $sp;
    $var(rc) = http_connect("bridge", "invite", "message/sip", $mb, "$var(sdp)");
    if ($var(rc) == 200 && $(var(sdp){s.len}) > 0) {
        xlog("L_INFO", "[SIP] bridge 200 OK, SDP len=$var(sdp){s.len} -> Linphone\n");
        # RFC 3261: UAS adds To tag in 200 OK. Append fixed tag so BYE matches dialog ($T not in 5.8; use regex backref).
        replace_hdrs("^To: \\([^\r\n]*\\)\r\n", "To: \\1;tag=server-12345678\r\n");
        append_to_reply("Contact: <sip:$rU@127.0.0.1:5061>\r\n");
        set_reply_body($var(sdp), "application/sdp");
        t_reply("200", "OK");
    } else if ($var(rc) == 404) {
        xlog("L_INFO", "[SIP] bridge 404 -> Not Found\n");
        t_reply("404", "Not Found");
    } else if ($var(rc) == 504) {
        xlog("L_INFO", "[SIP] bridge 504 -> 408 Timeout\n");
        t_reply("408", "Request Timeout");
    } else {
        xlog("L_INFO", "[SIP] bridge rc=$var(rc) -> 503\n");
        t_reply("503", "Service Unavailable");
    }
}

# BYE from bridge (127.0.0.1): send BYE to Linphone according to stored address from INVITE
route[FORWARD_BYE_TO_CLIENT] {
    $var(dst) = $sht(client=>$ci);
    if ($var(dst) == $null || $(var(dst){s.len}) == 0) {
        xlog("L_WARN", "[SIP] BYE from bridge, no client for Call-ID $ci\n");
        sl_reply("481", "Call/Transaction Does Not Exist");
        exit;
    }
    if (!t_newtran()) {
        sl_reply("500", "Internal Error");
        exit;
    }
    $du = "sip:" + $var(dst);
    xlog("L_INFO", "[SIP] BYE from bridge -> forward to $du\n");
    t_relay();
}

# BYE from Linphone: send Call-ID to bridge (m.call.hangup to Matrix), then 200 OK
route[BYE_TO_BRIDGE] {
    $var(bye_body) = $ci;
    $var(rc) = http_connect("bridge", "bye", "text/plain", $var(bye_body), "$var(dummy)");
    xlog("L_INFO", "[SIP] BYE bridge rc=$var(rc)\n");
    sl_reply("200", "OK");
}
