# RTPEngine – 3rd party media proxy for SIP ↔ WebRTC (standard, not our code).
# Configure and run per official docs: https://rtpengine.readthedocs.io/
# This YAML generates rtpengine.conf via scripts/generate_rtpengine_conf.py.
# Our bridge only does session init (Matrix ↔ SIP) and forwards SDP to RTPEngine via ng protocol.

rtpengine:
  # Interface for RTP/WebRTC media. Bridge advertises this in 200 OK so Linphone sends RTP here.
  # "0.0.0.0" → generate_rtpengine_conf.py replaces with this machine's IP (Element on LAN).
  # "127.0.0.1" → RTPEngine listens on localhost; use when Linphone and Element are on the same machine.
  interface: "127.0.0.1"

  # Ng control protocol – bridge connects to this address (RTPENGINE_URL=udp://127.0.0.1:2223)
  listen_ng: "0.0.0.0:2223"

  # UDP port range for RTP relay (must be mapped in Podman: -p 30000-30100:30000-30100/udp)
  port_min: 30000
  port_max: 30100

  # Timers (seconds)
  timeout: 60          # stream considered dead after 60 s without packets
  silent_timeout: 3600  # silent streams
  delete_delay: 0      # immediate deletion on delete

  # In container there is no kernel module – userspace only (table=-1)
  table: -1

  # Mode
  foreground: true   # in container run in foreground (logs to stdout)
  log_stderr: true
  log_level: 6       # 6 = info
