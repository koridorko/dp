; Author: Štefan Gajdošík <xgajdo30@stud.fit.vut.cz>
; Incoming SIP call: dialed number (EXTEN) is passed to Stasis app "matrix-bridge".
; Bridge looks up EXTEN in register.yaml -> Matrix user, creates External Media, rings Element.
[from-sip]
; _X. = any digits (extension)
exten => _X.,1,NoOp(Incoming call to ${EXTEN})
 same => n,Stasis(matrix-bridge,${EXTEN})
 same => n,Hangup()

; Fallback
exten => i,1,Hangup()
exten => t,1,Hangup()
exten => h,1,Hangup()
